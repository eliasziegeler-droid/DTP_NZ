{% extends "layout.html" %}
{% block body %}

<header class="aestethic header">
       

<div class="bike-container">
    <div class="bike-grid">
            {% for bike in bikes %}
            <div class="bike-card"> 
                <h2 class="bike-model">{{ bike[2] }}</h2>
                    
                    <div class="bike-card-content">
                        <div class="img">
                            <a href="#">  
                                <img src="{{ bike[6] }}" alt="Bike Image" class="bike-image">
                            </a>
                        </div>        
                            <div  class= "dropdown-content">
                                    
                                    <p>Topspeed: {{ bike[3] }} km/h </p>
                                    <p>Preis: {{ bike[4] }} € </p>
                                    <p>{{ bike[5] }}</p>
                            </div>                                                                                                                                                                                                            
                    </div>                                 
            </div>
            {% endfor %}
    </div>
</div>


  {% endblock %}
